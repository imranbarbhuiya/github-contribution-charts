[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-contribution-charts"
version = "0.1.0"
description = "Turn your GitHub contribution calendar into line and bar charts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Imran Hussain" }]
keywords = ["github", "contributions", "chart", "graphql", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
gh-contrib-chart = "github_contribution_charts.cli:main"

[project.urls]
Homepage = "https://github.com/imranbarbhuiya/github-contribution-charts"
Repository = "https://github.com/imranbarbhuiya/github-contribution-charts"
Issues = "https://github.com/imranbarbhuiya/github-contribution-charts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/github_contribution_charts"]
